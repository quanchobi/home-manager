name: Update Flake Lock

on:
  schedule:
    # Run on the 1st of every month at 00:00 UTC
    - cron: "0 0 1 * *"
  workflow_dispatch: # Allow manual triggering

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Update flake.lock
        id: update
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          pr-title: "chore: update flake.lock"
          pr-body: |
            Automated flake lock update

            This PR updates all flake inputs to their latest versions.
          pr-labels: |
            dependencies
            automated
          branch: update-flake-lock

      # A PR opened with GITHUB_TOKEN doesn't trigger pull_request workflows,
      # but a dispatched run does, and its checks attach to the branch head,
      # so they show up on the PR.
      - name: Run checks on the update branch
        if: steps.update.outputs.pull-request-number != ''
        run: gh workflow run check.yml --ref update-flake-lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
