name: Check and Validate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  # Also dispatched by update-flake.yml on the update-flake-lock branch, since
  # PRs opened with GITHUB_TOKEN don't trigger pull_request runs.
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: allow-import-from-derivation = true

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      # Determinate Nix builds checks for every system under --all-systems;
      # the runner is x86_64-only, so evaluate everything and build natively.
      - name: Evaluate flake outputs for all systems
        run: nix flake check --all-systems --no-build

      # treefmt (nixfmt, deadnix, statix, prettier, shellcheck, shfmt) and
      # nixosModules.default built on a minimal NixOS system.
      - name: Run flake check
        run: nix flake check

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - anderson
          - anderson@yappy-yiqi
          - jacob.hanks@canonical.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: allow-import-from-derivation = true

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      - name: Build ${{ matrix.config }}
        run: |
          nix build '.#homeConfigurations."${{ matrix.config }}".activationPackage' --no-link
