name: Check and Validate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  # Also dispatched by update-flake.yml on the update-flake-lock branch, since
  # PRs opened with GITHUB_TOKEN don't trigger pull_request runs.
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: allow-import-from-derivation = true

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check flake formatting with treefmt
        run: nix fmt -- --fail-on-change

      # Determinate Nix builds checks for every system under --all-systems;
      # the runner is x86_64-only, so evaluate everything and build natively.
      - name: Evaluate flake outputs for all systems
        run: nix flake check --all-systems --no-build

      - name: Run flake check
        run: nix flake check

      - name: Check module evaluation
        run: |
          nix eval .#nixosModules.default --apply 'x: true'

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - anderson
          - anderson@yappy-yiqi
          - jacob.hanks@canonical.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: allow-import-from-derivation = true

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build ${{ matrix.config }}
        run: |
          nix build '.#homeConfigurations."${{ matrix.config }}".activationPackage' --no-link

  deadnix-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: allow-import-from-derivation = true

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check for dead code with deadnix
        run: |
          nix run nixpkgs#deadnix -- --fail .

  statix-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: allow-import-from-derivation = true

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Run statix linter
        run: |
          nix run nixpkgs#statix -- check .
